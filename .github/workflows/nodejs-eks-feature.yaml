name: nodejs-eks-ci

on:
  workflow_call:
    inputs:
      project:
        required: true
        type: string
      component:
        required: true
        type: string

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read version
        run: |
          echo "Project: ${{ inputs.project }}"
          echo "Component: ${{ inputs.component }}" 