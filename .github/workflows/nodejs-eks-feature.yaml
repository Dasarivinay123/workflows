name: nodejs-eks-feature

on:
  workflow_call:
    inputs:
      project:
        required: true
        type: string
      component:
        required: true
        type: string
env:
  project: ${{ inputs.project }}
  component: ${{ inputs.component }}
jobs:
  build-nodejs:
    # runs-on: ubuntu-latest
    runs-on: [self-hosted, Linux, X64, roboshop, nodejs]
    steps:
    - name: Checkout code
      uses: actions/checkout@v3 #this are like plugins in jenkins

    - name: list files
      run: ls -l
      
    - name: Read version
      run: |
        echo "Project: ${{ inputs.project }}"
        echo "Component: ${{ inputs.component }}" 
    - name: read version
      id: version
      run: |
       VERSION=$(jq -r '.version' package.json)
       echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: print version
      run: echo "version is ${{ steps.version.outputs.version }}"
    - name: Unit-tests
      run: npm test